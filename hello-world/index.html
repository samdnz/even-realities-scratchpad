<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — Even Realities</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; color: #e0e0e0; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: clamp(2rem, 8vw, 5rem); font-weight: 700; letter-spacing: -0.03em; }
    h1 span { color: #00d4ff; }
    p { margin-top: 1rem; font-size: 1rem; opacity: 0.6; }
  </style>
</head>
<body>
  <main style="text-align:center">
    <h1>Hello <span>World</span></h1>
    <p>Even Realities scratchpad app</p>
  </main>
</body>
</html>
